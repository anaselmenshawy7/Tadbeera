name: Tedbeera - Build APK with New Pink Icon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-new-icon-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Install Python image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate source icon exists
        run: |
          test -s public/assets/aistudio/a_clean_glossy_modern_app_icon_design_in_a_soft_2efdb44d.png
          file public/assets/aistudio/a_clean_glossy_modern_app_icon_design_in_a_soft_2efdb44d.png

      - name: Generate complete Android and PWA icon set from the approved artwork
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json

          source = Path("public/assets/aistudio/a_clean_glossy_modern_app_icon_design_in_a_soft_2efdb44d.png")
          image = Image.open(source).convert("RGBA")
          res = Path("android/app/src/main/res")
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, px in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = image.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)

          foreground = Image.new("RGBA", (432,432), (0,0,0,0))
          fg = image.resize((288,288), Image.Resampling.LANCZOS)
          foreground.alpha_composite(fg, (72,72))
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          foreground.save(res / "drawable/ic_launcher_foreground.png", optimize=True)

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\\n<resources>\\n    <color name="ic_launcher_background">#F7A9C2</color>\\n</resources>\\n'
          )

          public = Path("public")
          for name, px in [("favicon.png",64),("icon-192.png",192),("icon-512.png",512),
                           ("icon-maskable-512.png",512),("apple-touch-icon.png",180),
                           ("pwa-192x192.png",192),("pwa-512x512.png",512)]:
              image.resize((px,px), Image.Resampling.LANCZOS).save(public/name, optimize=True)

          play = Path("play-store")
          play.mkdir(exist_ok=True)
          image.resize((512,512), Image.Resampling.LANCZOS).save(play/"ic_launcher_512.png", optimize=True)
          print("Generated Android density icons, adaptive icons, PWA icons and Play Store icon.")
          PY

      - name: Run TypeScript validation and tests
        run: |
          npm run lint
          npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Re-apply generated native launcher icons after Capacitor sync
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("public/assets/aistudio/a_clean_glossy_modern_app_icon_design_in_a_soft_2efdb44d.png")
          image = Image.open(source).convert("RGBA")
          res = Path("android/app/src/main/res")
          for density, px in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = image.resize((px,px), Image.Resampling.LANCZOS)
              icon.save(folder/"ic_launcher.png", optimize=True)
              icon.save(folder/"ic_launcher_round.png", optimize=True)
          fg = Image.new("RGBA",(432,432),(0,0,0,0))
          fg.alpha_composite(image.resize((288,288),Image.Resampling.LANCZOS),(72,72))
          fg.save(res/"drawable/ic_launcher_foreground.png", optimize=True)
          PY

      - name: Build fresh debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK and icon resources
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.png
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload new-icon APK
        uses: actions/upload-artifact@v4
        with:
          name: Tedbeera-New-Pink-Icon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
